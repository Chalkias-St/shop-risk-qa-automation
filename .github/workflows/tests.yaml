name: QA Automation Tests

on:
  push:
    branches:
      - main
  schedule:
    -cron: "0 22 * * *"

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install

      - name: Run smoke tests
        run: pytest -m smoke -v
